name: Refresh xncfbox

on:
  workflow_dispatch:
  push:
    paths:
      - worker/xncfbox/**
      - tests/test_xncfbox.mjs
      - tests/test_xncfbox_refresh.py
      - .github/workflows/xncfbox.yml
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: xncfbox-refresh
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test xncfbox request handling
        run: node tests/test_xncfbox.mjs

      - name: Test xncfbox refresh tool
        run: python3 tests/test_xncfbox_refresh.py

      - name: Check production from GitHub network
        env:
          WORKER_URL: ${{ secrets.XNCFBOX_WORKER_URL || vars.XNCFBOX_WORKER_URL || 'https://xncfbox.waynee.workers.dev' }}
        run: |
          curl --silent --show-error --fail-with-body --max-time 30 "${WORKER_URL%/}/health" -o health.json
          cat health.json
          python3 -c 'import json; d=json.load(open("health.json")); assert d.get("service")=="xncfbox" and d.get("configured") is True, "Worker is not configured"'

  refresh:
    needs: health
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run standalone xncfbox verification
        env:
          WORKER_URL: ${{ secrets.XNCFBOX_WORKER_URL || vars.XNCFBOX_WORKER_URL || 'https://xncfbox.waynee.workers.dev' }}
          CHECKER_TOKEN: ${{ secrets.XNCFBOX_CHECKER_TOKEN }}
          CF_MANIFEST_PATH: data/xncfbox/cf_manifest.json
        run: python3 worker/xncfbox/refresh.py

      - name: Publish xncfbox manifest
        if: success()
        env:
          CF_MANIFEST_PATH: data/xncfbox/cf_manifest.json
          CF_API_TOKEN: ${{ secrets.XNCFBOX_CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.XNCFBOX_CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.XNCFBOX_CF_KV_NAMESPACE_ID }}
        run: python3 worker/xncfbox/publish_manifest.py

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xncfbox-refresh-report
          retention-days: 3
          path: |
            data/xncfbox/report.json
            data/xncfbox/cf_manifest.json
